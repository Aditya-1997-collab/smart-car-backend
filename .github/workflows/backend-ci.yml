# .github/workflows/backend-ci.yml
name: Smart Car Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the backend codebase into the virtual machine container
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # 2. Setup a clean, optimized Python environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Speeds up subsequent runs by caching downloaded wheel files

    # 3. Upgrade pip and pull in packages recorded in your registry file
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Run the code linter to catch syntax errors or undefined variables
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all warnings as warnings (doesn't break build for minor spaces/tabs)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. Execute an un-orchestrated compilation test to guarantee absolute import safety
    - name: Test Application Compilation
      run: |
        python -m compileall app/ main.py
